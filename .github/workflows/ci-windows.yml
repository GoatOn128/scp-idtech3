name: build-windows

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: windows-x86-${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: build
        id: build
        shell: pwsh
        run: |
          $fail = 0
          & cmake -S . -B out -G "Visual Studio 17 2022" -A Win32 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          if ($fail -eq 0) {
            & cmake --build out --config ${{ matrix.configuration }} --parallel 2>&1 | Tee-Object -FilePath build.log -Append
            if ($LASTEXITCODE -ne 0) { $fail = $LASTEXITCODE }
          }
          exit $fail

      - name: digest
        if: always()
        env:
          LEG: windows-x86-${{ matrix.configuration }}
          STATUS: ${{ steps.build.outcome }}
        shell: pwsh
        run: python .github/scripts/digest.py

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-windows-x86-${{ matrix.configuration }}
          path: |
            build.log
            status-*
            digest-fragment-*
            log-*.log
          if-no-files-found: error

      - name: upload binaries
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x86-${{ matrix.configuration }}
          path: |
            bin/*.exe
            bin/*.dll
            main/*.dll
          if-no-files-found: warn
